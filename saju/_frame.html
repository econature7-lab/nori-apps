<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>frame</title>
<style>html,body{margin:0;padding:0;background:#000}iframe{border:0;display:block;background:#16122B}</style>
</head><body>
<iframe id="fr" allow="clipboard-write"></iframe>
<script>
var q = new URLSearchParams(location.search);
var w = +(q.get("w") || 390), h = +(q.get("h") || 844);
var src = q.get("src") || "../saju/";
var fr = document.getElementById("fr");
fr.width = w; fr.height = h; fr.style.width = w + "px"; fr.style.height = h + "px";
fr.src = src + (src.indexOf("?") < 0 ? "?" : "&") + "t=" + Date.now();
</script>
</body></html>
